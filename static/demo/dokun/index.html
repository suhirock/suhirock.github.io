<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heartbeat Slideshow Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="slide">
      <div class="zoom-layer">
        <div class="pulse-layer"></div>
      </div>
    </div>
    <div class="slide">
      <div class="zoom-layer">
        <div class="pulse-layer"></div>
      </div>
    </div>
  </div>
  <div id="volume-control">
    <button id="volume-btn" aria-label="ミュート解除">🔇</button>
    <input type="range" id="volume-slider" min="0" max="100" value="60" aria-label="音量">
  </div>
  <script src="script.js"></script>
</body>
</html>
